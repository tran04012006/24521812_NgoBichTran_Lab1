
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drum Kit Engine</title>
</head>

<body>
  <main>
    <h1>Drum Kit Engine</h1>
    <p>Press the keys to play drums</p>

    <section class="drum-kit" aria-label="Drum pads">
      <button type="button" data-key="a" data-sound="kick">
        A - Kick
      </button>

      <button type="button" data-key="s" data-sound="snare">
        S - Snare
      </button>

      <button type="button" data-key="d" data-sound="hihat">
        D - Hi-Hat
      </button>

      <button type="button" data-key="f" data-sound="clap">
        F - Clap
      </button>
    </section>
  </main>
</body>
</html>
